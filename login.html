<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Format Bin · Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Same darkroom palette as the gallery: one locked frame with a safelight stamp. */
:root {
  --bg: #e9ebee; --surface: #f7f8f9; --ink: #16191d; --muted: #535a64; --line: #c9ced5;
  --safelight: #a92d18; --safelight-soft: #f6ddd6; --chip: #dde1e6;
  --display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --body: "Source Serif 4", Georgia, serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111316; --surface: #1a1d21; --ink: #ecedef; --muted: #9aa2ad; --line: #2c3138;
    --safelight: #ff6847; --safelight-soft: #3a1f19; --chip: #252a30; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111316; --surface: #1a1d21; --ink: #ecedef; --muted: #9aa2ad; --line: #2c3138;
  --safelight: #ff6847; --safelight-soft: #3a1f19; --chip: #252a30; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; padding: 16px; display: grid; place-items: center; min-height: 100vh; }
main { width: 100%; max-width: 420px; display: grid; gap: 22px; }
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--safelight); margin: 0; }
h1 { font-family: var(--display); font-stretch: 68%; font-weight: 800; font-size: clamp(56px, 16vw, 92px); line-height: .9; margin: 0; letter-spacing: -.01em; }
.lede { color: var(--muted); margin: 0; }
form { display: grid; gap: 10px; border-top: 2px solid var(--ink); padding-top: 18px; }
label { font-family: var(--display); font-stretch: 85%; font-weight: 600; font-size: 15px; }
input { font: 16px var(--body); padding: 11px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); width: 100%; }
button { font-family: var(--display); font-stretch: 85%; font-weight: 700; font-size: 16px; padding: 11px 16px; border-radius: 6px; border: 1px solid var(--ink); background: var(--ink); color: var(--bg); cursor: pointer; }
button:hover { background: var(--safelight); border-color: var(--safelight); }
input:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--safelight); outline-offset: 2px; }
.error { display: none; margin: 0; font-size: 14px; color: var(--safelight); background: var(--safelight-soft); padding: 8px 10px; border-radius: 6px; }
.error.show { display: block; }
.access { border: 1px dashed var(--line); border-radius: 8px; padding: 14px 16px; display: grid; gap: 10px; }
.access p { margin: 0; color: var(--muted); font-size: 15px; }
.access b { color: var(--ink); }
.links { display: flex; flex-wrap: wrap; gap: 8px; }
.links a { font-family: var(--display); font-stretch: 85%; font-weight: 600; font-size: 14px; text-decoration: none; color: var(--ink); padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); display: inline-flex; gap: 6px; align-items: center; }
.links a:hover { border-color: var(--safelight); color: var(--safelight); }
.links svg { width: 16px; height: 16px; }
</style>
</head>
<body>
<main>
  <div>
    <p class="eyebrow">Private gallery</p>
    <h1>Format Bin</h1>
  </div>
  <p class="lede">55 video formats, each with a reference code. Enter the access password to open the gallery.</p>

  <form method="post" action="/api/login">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
    <p class="error" id="error" role="alert">Wrong password. Try again.</p>
    <button type="submit">Open gallery</button>
  </form>

  <div class="access">
    <p><b>No password?</b> Contact me on WhatsApp or Instagram to get access.</p>
    <div class="links">
      <a href="https://wa.me/919619141433" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2c-1.5 0-3-.4-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.4.1-.7.3-.2.3-.9.9-.9 2.2s.9 2.5 1 2.7c.1.2 1.8 2.8 4.4 3.9 1.6.7 2.3.8 3.1.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3Z"/></svg>
        WhatsApp
      </a>
      <a href="https://instagram.com/_.bhavya._015" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
        Instagram
      </a>
    </div>
  </div>
</main>
<script>
  if (new URLSearchParams(location.search).has('error')) document.getElementById('error').classList.add('show');
</script>
</body>
</html>
